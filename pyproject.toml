[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wequota"
version = "0.1.0"
description = "WeQuota - 微信聊天 Token 限额工具（自部署）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.5",
    "websockets==14.2",
    "tiktoken==0.8.0",
    "faster-whisper==1.1.1",
    "av==13.1.0",
    "huggingface-hub==0.27.1",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
wequota = "wequota.cli:main"

[tool.setuptools.packages.find]
include = ["wequota*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
